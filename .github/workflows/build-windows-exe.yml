name: Build Windows executable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # a stable, well-supported version for PyInstaller/Pillow

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller --onefile --name AutoSubmit main.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoSubmit-windows
          path: dist/AutoSubmit.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AutoSubmit.exe
          generate_release_notes: true
          body: |
            **AutoSubmit.exe** — a prebuilt Windows executable, no Python required.

            Download it below and run it directly. See the [README](../../blob/main/README.md) for calibration steps (hover the button, press F8, then start watching).

            ---